
name: Build Apple Maps APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web files
        run: |
          mkdir -p www
          cp -R *.html *.css *.js *.png *.jpg *.jpeg *.svg *.webmanifest www/ 2>/dev/null || true
          test -f www/index.html || (echo "index.html not found" && exit 1)
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          npx cap init "Apple Maps" "com.maksimilutin.applemaps" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Add GPS permissions
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$FILE"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Maps-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
